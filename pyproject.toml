[project]
name = "toyradar"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "scikit-learn", "h5py", "sounddevice"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["toyradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
